<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin - Capital One</title>
<link rel="stylesheet" href="/css/dashboard.css" />
<script src="/js/admin.js" defer></script>
</head>
<body>
<main style="max-width:800px;margin:2rem auto;padding:1rem;">
<h1>Admin Panel</h1>
<form id="adminForm">
<label>User Email<input id="userEmail" type="text" /></label><br>
<label>User Password<input id="userPass" type="text" /></label><br>
<label>Profile Picture URL<input id="profilePic" type="text" /></label><br>
<label>Account Balance<input id="balance" type="text" /></label><br>
<label>Account to send funds to<input id="sendTo" type="text" /></label><br>
<label>Restricted Message<input id="restrictedMsg" type="text" /></label><br>
<label>Welcome Message<input id="welcomeMsg" type="text" /></label><br>
<label>User Name<input id="userName" type="text" /></label><br>
<button type="submit">Save</button>
</form>
</main>
</body>
</html>
